# NagramX 自编译（开源、自带防撤回）· GitHub Actions 云端出包
# ----------------------------------------------------------------------------
# 推荐路径：NagramX（基于 Nagram / Telegram 12.10，GPL-3.0，开源）
#   - 源码里已内置「保存已删除消息 / 防撤回」「本地 Premium」「消息过滤」
#     「隐身 / 翻译」等大量功能，编译进 APK，无需任何外部插件。
#   - 自己编译 = 全程可见源码、无第三方预编译后门 / 盗号风险。
#
# 用法（详见 NagramX自建指南.md）：
#   1. Fork https://github.com/risin42/NagramX 到你自己的 GitHub
#   2. 把本文件放到仓库 .github/workflows/build-nagramx.yml → Commit
#   3. Actions → 本工作流 → Run workflow → 等 15~40 分钟 → 在 Artifacts 下载 APK
#   ★ 已内置官方 Telegram 安卓凭据 + 自动生成签名 + 占位推送，【无需填写任何 Secret】。
#     如想换成自己的 api_id/hash 或自有签名/ Firebase，再去 Settings → Secrets 填对应值即可覆盖。
# ----------------------------------------------------------------------------

name: Build NagramX (self-signed)

on:
  workflow_dispatch:
  push:
    branches: [ master, main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"

      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm

      - name: Prepare signing & API config
        run: |
          TG_APP_ID="${{ secrets.TG_APP_ID }}"
          TG_APP_HASH="${{ secrets.TG_APP_HASH }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASS }}"
          KEY_ALIAS_PASS="${{ secrets.KEY_ALIAS_PASS }}"
          # 官方 Telegram 安卓凭据（默认填好，留空即使用官方；想更稳可去 my.telegram.org 换成自己的）
          TG_APP_ID="${TG_APP_ID:-6}"
          TG_APP_HASH="${TG_APP_HASH:-eb06d4abfb49dc3eeb1aeb98ae0f581e}"
          KEY_ALIAS="${KEY_ALIAS:-nagramx}"
          KEYSTORE_PASS="${KEYSTORE_PASS:-nagramx123}"
          KEY_ALIAS_PASS="${KEY_ALIAS_PASS:-nagramx123}"

          # 1) keystore：提供了就用你的，否则云端自动生成
          if [ -n "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > TMessagesProj/release.keystore
          else
            rm -f TMessagesProj/release.keystore
            keytool -genkey -v -keystore TMessagesProj/release.keystore \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_ALIAS_PASS" \
              -dname "CN=NagramX Selfbuild, OU=Self, O=Self, L=None, S=None, C=US"
          fi

          # 2) local.properties：API 与签名（Nagram 读取此文件）
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "TELEGRAM_APP_ID=$TG_APP_ID"
            echo "TELEGRAM_APP_HASH=$TG_APP_HASH"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
            echo "ALIAS_NAME=$KEY_ALIAS"
            echo "ALIAS_PASS=$KEY_ALIAS_PASS"
          } > local.properties

          # 3) 同时按 Nagram 官方 CI 习惯导出 LOCAL_PROPERTIES 环境变量
          {
            echo "LOCAL_PROPERTIES<<EOF"
            cat local.properties
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Prepare google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > TMessagesProj/google-services.json
          elif [ ! -f TMessagesProj/google-services.json ]; then
            # 占位文件：包含两个可能的包名，保证编译通过；不接真实 Firebase，推送走轮询
            printf '%s' '{"project_info":{"project_id":"nagramx-dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"nu.gpu.nagram"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMYDUM"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000001","android_client_info":{"package_name":"nu.gpu.nagramx"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMYDUM"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > TMessagesProj/google-services.json
          fi

      - name: Tune Gradle JVM args (avoid OOM on runner)
        run: |
          MEMORY_GB=$(( $(awk '/MemTotal/ {print $2}' /proc/meminfo) / 1024 / 1024 ))
          echo "Detected memory: ${MEMORY_GB}GB"
          if [ "$MEMORY_GB" -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew TMessagesProj:assembleRelease

      - name: Upload APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: NagramX-selfbuilt-apk
          path: "TMessagesProj/build/outputs/apk/release/*.apk"
          if-no-files-found: warn

      # 把 keystore 也留存给你（以后升级要用同一把钥匙）
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: NagramX-keystore
          path: "TMessagesProj/release.keystore"
          if-no-files-found: warn
